x-postgres-environment: &postgres-environment
  PGHOST: postgres
  PGPORT: "5432"
  PGUSER: ${POSTGRES_USER:-bharatindex}
  PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the services}
  PGDATABASE: ${DB_ENV_PREFIX:-dev}-bharat-index
  PGSSLMODE: disable

x-postgres-dependency: &postgres-dependency
  postgres:
    condition: service_healthy

x-redis-dependencies: &redis-dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  postgres:
    image: bharat-index-postgres:local
    build:
      context: ./db
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_ENV_PREFIX: ${DB_ENV_PREFIX:-dev}
      POSTGRES_DB: ${DB_ENV_PREFIX:-dev}-bharat-index
      POSTGRES_USER: ${POSTGRES_USER:-bharatindex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the services}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  bata:
    image: bharat-index-stock:local
    build:
      context: ./services/stock
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on: *redis-dependencies
    environment:
      <<: *postgres-environment
      REDIS_ADDR: redis:6379
      STOCK_ID: BT001

  tata:
    image: bharat-index-stock:local
    build:
      context: ./services/stock
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on: *redis-dependencies
    environment:
      <<: *postgres-environment
      REDIS_ADDR: redis:6379
      STOCK_ID: TT001

  calc-index:
    image: bharat-index-calc-index:local
    build:
      context: ./services/calc-index
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on: *redis-dependencies
    environment:
      <<: *postgres-environment
      REDIS_ADDR: redis:6379
      STOCK_IDS: ${STOCK_IDS:-BT001,TT001}

  ui:
    image: bharat-index-ui:local
    build:
      context: ./services/ui
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on: *postgres-dependency
    environment:
      <<: *postgres-environment
      UI_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"

  admin:
    image: bharat-index-admin:local
    build:
      context: ./services/admin
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on: *postgres-dependency
    environment:
      <<: *postgres-environment
      ADMIN_PORT: "8081"
    ports:
      - "127.0.0.1:8081:8081"

volumes:
  postgres_data:
  redis_data:
