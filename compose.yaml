x-market-service: &market-service
  image: bharat-index-services:local
  build:
    context: .
    dockerfile: services/Dockerfile
  restart: unless-stopped
  environment:
    PGHOST: postgres
    PGPORT: "5432"
    PGUSER: ${POSTGRES_USER:-bharatindex}
    PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the services}
    PGDATABASE: ${DB_ENV_PREFIX:-dev}-bharat-index
    REDIS_ADDR: redis:6379
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    build:
      context: ./db
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_ENV_PREFIX: ${DB_ENV_PREFIX:-dev}
      POSTGRES_DB: ${DB_ENV_PREFIX:-dev}-bharat-index
      POSTGRES_USER: ${POSTGRES_USER:-bharatindex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the services}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  bata:
    <<: *market-service
    command: ["stock"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-bharatindex}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the services}
      PGDATABASE: ${DB_ENV_PREFIX:-dev}-bharat-index
      REDIS_ADDR: redis:6379
      STOCK_ID: BT001

  tata:
    <<: *market-service
    command: ["stock"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-bharatindex}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the services}
      PGDATABASE: ${DB_ENV_PREFIX:-dev}-bharat-index
      REDIS_ADDR: redis:6379
      STOCK_ID: TT001

  calc-index:
    <<: *market-service
    command: ["calc-index"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-bharatindex}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the services}
      PGDATABASE: ${DB_ENV_PREFIX:-dev}-bharat-index
      REDIS_ADDR: redis:6379
      STOCK_IDS: ${STOCK_IDS:-BT001,TT001}

  ui:
    <<: *market-service
    command: ["ui"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-bharatindex}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the services}
      PGDATABASE: ${DB_ENV_PREFIX:-dev}-bharat-index
      UI_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"

  admin:
    <<: *market-service
    command: ["admin"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-bharatindex}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the services}
      PGDATABASE: ${DB_ENV_PREFIX:-dev}-bharat-index
      ADMIN_PORT: "8081"
    ports:
      - "127.0.0.1:8081:8081"

volumes:
  postgres_data:
  redis_data:
